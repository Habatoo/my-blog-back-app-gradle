plugins {
    id 'java-platform'
    id 'maven-publish'
}

description = 'Bill of Materials for Gradle Blog Back Webapp'

javaPlatform {
    allowDependencies()
}

publishing {
    publications {
        mavenBom(MavenPublication) {
            from components.javaPlatform
        }
    }
}


dependencies {
    constraints {
        api 'org.projectlombok:lombok:1.18.42'
        api 'org.springframework:spring-context:6.2.11'
        api 'org.springframework:spring-webmvc:6.2.11'
        api 'org.springframework.data:spring-data-jdbc:3.5.4'
        api 'jakarta.servlet:jakarta.servlet-api:6.0.0'
        api 'javax.annotation:javax.annotation-api:1.3.2'
        api 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
        api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.20.0'
        api 'org.flywaydb:flyway-core:11.14.0'
        api 'org.flywaydb:flyway-database-postgresql:11.14.0'
        api 'com.h2database:h2:2.4.240'
        api 'org.postgresql:postgresql:42.7.3'
        api 'commons-fileupload:commons-fileupload:1.5'
        api 'commons-io:commons-io:2.15.1'
        api 'org.slf4j:slf4j-api:2.0.17'
        api 'ch.qos.logback:logback-classic:1.5.18'

        // тестовые зависимости
        api 'junit:junit:4.13.2'
        api 'org.junit.jupiter:junit-jupiter:5.10.0'
        api 'org.hamcrest:hamcrest:3.0'
        api 'org.mockito:mockito-junit-jupiter:4.11.0'
        api 'org.mockito:mockito-core:5.20.0'
        api 'org.mockito:mockito-inline:5.2.0'
        api 'org.assertj:assertj-core:3.27.3'
        api 'org.springframework:spring-test:6.2.11'
        api 'org.slf4j:slf4j-simple:2.0.17'
        api 'com.zaxxer:HikariCP:5.0.1'
        api 'org.testcontainers:testcontainers:2.0.0'
        api 'org.testcontainers:junit-jupiter:1.21.3'
        api 'org.testcontainers:postgresql:1.21.3'
        api 'org.skyscreamer:jsonassert:1.5.1'
        api 'com.jayway.jsonpath:json-path:2.9.0'
    }
}
